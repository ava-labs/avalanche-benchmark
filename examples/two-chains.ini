# The two-chain shape on three worker machines and one P-chain machine.
# The main chain has 4 validators and 2 RPC nodes. The trading chain has
# 4 validators and 1 RPC node. One P-chain node serves both chains. One
# management committee manages both chains. Ports are positional per
# machine: the first node on a machine gets 9650/9651, the second
# 9652/9653, and so on.
#
# The weight= tags make each chain's shape explicit: three heavy
# validators and one spare per chain. These values equal the default
# ladder, so removing every weight= tag changes nothing. Set the tag on
# every validator of a chain or on none; a mix is a load error.
# Copy chains/default/genesis-template.json to
# chains/trading/genesis-template.json and change the chainId before
# l1 create. Two chains must not share one EVM chainId, and l1 create
# refuses it. Keep the $genesis-funds alloc line: it funds the account
# bombard spends on that chain. chains/trading/subnet-config.json is
# optional; without it the chain uses chains/default/subnet-config.json.
1  host=10.0.0.11 role=validator weight=100000
2  host=10.0.0.12 role=validator weight=100000
3  host=10.0.0.13 role=validator weight=100000
4  host=10.0.0.11 role=validator weight=1000
5  host=10.0.0.12 role=rpc
6  host=10.0.0.13 role=rpc
7  host=10.0.0.11 role=validator weight=100000 chain=trading
8  host=10.0.0.12 role=validator weight=100000 chain=trading
9  host=10.0.0.13 role=validator weight=100000 chain=trading
10 host=10.0.0.11 role=validator weight=1000   chain=trading
11 host=10.0.0.12 role=rpc       chain=trading
12 host=10.0.0.14 role=pchain
