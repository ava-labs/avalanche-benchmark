# The two-chain shape on three worker machines and one P-chain machine.
# The main chain has 4 validators and 2 RPC nodes. The trading chain has
# 4 validators and 1 RPC node. One P-chain node serves both chains. One
# management committee manages both chains. Ports are positional per
# machine: the first node on a machine gets 9650/9651, the second
# 9652/9653, and so on.
#
# Each chain gets its own weight ladder: the first three validators of
# each chain by node number start at weight 100000, the rest at 1000.
# Create chains/trading/genesis-template.json with its own chainId before
# l1 create. Two chains must not share one EVM chainId, and l1 create
# refuses it. chains/trading/subnet-config.json is optional; without it
# the chain uses the root subnet-config.json.
1  host=10.0.0.11 role=validator
2  host=10.0.0.12 role=validator
3  host=10.0.0.13 role=validator
4  host=10.0.0.11 role=validator
5  host=10.0.0.12 role=rpc
6  host=10.0.0.13 role=rpc
7  host=10.0.0.11 role=validator chain=trading
8  host=10.0.0.12 role=validator chain=trading
9  host=10.0.0.13 role=validator chain=trading
10 host=10.0.0.11 role=validator chain=trading
11 host=10.0.0.12 role=rpc       chain=trading
12 host=10.0.0.14 role=pchain
