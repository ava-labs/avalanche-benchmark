# The settlement-feed shape: the main chain plus the oracle chain, on three
# worker machines and one P-chain machine. chain=oracle is a normal chain
# name. The kit ships its genesis template and consensus files in
# chains/oracle/. The oracle chain needs at least one validator and one rpc
# node; the feed writes through that rpc. The oracle chain's genesis
# prebakes the aggregator contract. The main chain's receiver installs
# after creation with `oracle upgrade` and `fleet upgrade`
# (playbooks/08-install-app.md). Ports are positional per machine: the
# first node on a machine gets 9650/9651, the second 9652/9653, and so on.
#
# The weight= tags make the main chain's shape explicit: three heavy
# validators and one spare, equal to the default ladder. The oracle chain
# takes no weight= tag: its validators keep the flat oracle weight, and it
# runs no failover ladder.
1  host=10.0.0.11 role=validator weight=100000
2  host=10.0.0.12 role=validator weight=100000
3  host=10.0.0.13 role=validator weight=100000
4  host=10.0.0.11 role=validator weight=1000
5  host=10.0.0.12 role=rpc
6  host=10.0.0.13 role=rpc
7  host=10.0.0.11 role=validator chain=oracle
8  host=10.0.0.12 role=rpc       chain=oracle
9  host=10.0.0.14 role=pchain
