# The two-site UAT shape: 8 validators and 4 RPC nodes on two sites, 2
# archive nodes, and one P-chain node. The weight= tags make the failover
# design explicit. The three heavy validators (weight=100000) at site A are
# the active set. Every other validator is a spare at weight=1000. The
# chain continues through the loss of one heavy validator. The chain stops
# when two heavy validators are down; this stop is the designed behavior.
# These values equal the default ladder, so removing every weight= tag
# changes nothing. The dc= tags appear in the status table and in the
# dashboards.
1  host=10.0.0.11 role=validator weight=100000 dc=A
2  host=10.0.0.12 role=validator weight=100000 dc=A
3  host=10.0.0.13 role=validator weight=100000 dc=A
4  host=10.0.0.14 role=validator weight=1000   dc=A
5  host=10.1.0.11 role=validator weight=1000   dc=B
6  host=10.1.0.12 role=validator weight=1000   dc=B
7  host=10.1.0.13 role=validator weight=1000   dc=B
8  host=10.1.0.14 role=validator weight=1000   dc=B
9  host=10.0.0.15 role=rpc       dc=A
10 host=10.0.0.16 role=rpc       dc=A
11 host=10.1.0.15 role=rpc       dc=B
12 host=10.1.0.16 role=rpc       dc=B
13 host=10.2.0.10 role=pchain
14 host=10.0.0.17 role=archive   dc=A
15 host=10.1.0.17 role=archive   dc=B
